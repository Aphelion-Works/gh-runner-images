# OpenSSF Scorecard: supply-chain security checks (pinned dependencies, token
# permissions, branch protection…). Results go to Security → Code scanning.
#
# Runs on the org's OVH runners, so results aren't published to the public
# Scorecard API (that requires GitHub's own runners) and there's no badge.
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"   # weekly, Monday 03:23 UTC

permissions: read-all

jobs:
  analysis:
    runs-on: [self-hosted, ovh]
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
